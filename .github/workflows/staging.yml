name: Staging (follows main)

# Every successful build of a commit on main becomes the desired state for
# staging. Nothing here talks to the cluster: it commits a new image digest to
# deploy/k8s/overlays/staging and Argo CD does the rest.
#
# Trigger is push to main only. Pull requests are tested by deploy.yml with
# read-only permissions; untrusted PR code never reaches this workflow.

on:
  push:
    branches: [main]
    # Our own digest commits (and human edits to overlays) must not rebuild the image.
    paths-ignore:
      - deploy/k8s/overlays/**
  workflow_dispatch:

permissions: {}

# Queue, never cancel a build that is already running. GitHub keeps only the
# newest *waiting* run, which is what we want: the latest main wins.
concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    permissions:
      contents: read
      packages: write
    with:
      commit: ${{ github.sha }}
      ref: main
      full-test: true

  promote:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Promote to staging
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          COMMIT: ${{ github.sha }}
          BUILD_NOW: ${{ needs.build.outputs.build-now }}
          PUBLISHED: ${{ needs.build.outputs.published }}
        run: scripts/ci/promote.sh staging staging "$DIGEST" main "$COMMIT" "$BUILD_NOW" "$PUBLISHED"
