name: Release (production follows tags)

# Production only changes when a tag vX.Y.Z is pushed (or a rollback is
# dispatched on purpose). The tag must point at a commit that is already on main.
#
#   git tag -a v1.2.0 -m 'v1.2.0' && git push origin v1.2.0      # or scripts/release.sh v1.2.0
#
# The image is built from exactly that commit. If an older release workflow
# finishes after a newer one, scripts/deploy-state.mjs refuses to move production
# backwards. Argo CD, not this workflow, applies the change to the cluster.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)deploy, e.g. v1.2.0
        required: true
        type: string
      rollback:
        description: Allow moving production to an OLDER release
        type: boolean
        default: false

permissions: {}

# Releases queue one at a time; a newer waiting release replaces an older waiting
# one, which is safe because the newer release supersedes it anyway.
concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: Checkout (full history and tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate the tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a vX.Y.Z release tag"; exit 1
          fi
          commit=$(git rev-parse --verify "refs/tags/${TAG}^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::$TAG ($commit) is not on main. Releases come from main only."; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG at $commit" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: resolve
    uses: ./.github/workflows/_build.yml
    permissions:
      contents: read
      packages: write
    with:
      commit: ${{ needs.resolve.outputs.commit }}
      ref: ${{ needs.resolve.outputs.tag }}
      tag-prefix: ${{ needs.resolve.outputs.tag }}
      # A rollback re-deploys a tag that already passed its tests.
      full-test: ${{ !inputs.rollback }}

  promote:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Promote to production
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          TAG: ${{ needs.resolve.outputs.tag }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
          BUILD_NOW: ${{ needs.build.outputs.build-now }}
          PUBLISHED: ${{ needs.build.outputs.published }}
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          extra=()
          if [ "$ROLLBACK" = "true" ]; then extra+=(--rollback); fi
          scripts/ci/promote.sh production release "$DIGEST" "$TAG" "$COMMIT" "$BUILD_NOW" "$PUBLISHED" "${extra[@]}"
