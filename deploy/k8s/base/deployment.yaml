apiVersion: apps/v1
kind: Deployment
metadata:
  name: chicanodev-web
  labels:
    app.kubernetes.io/name: chicanodev
    app.kubernetes.io/component: web
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: chicanodev
      app.kubernetes.io/component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below 2 serving pods: start the new pod first, then retire an old one.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chicanodev
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: chicanodev
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101   # "nginx" in nginx-unprivileged
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      # Prefer different nodes so one node failure cannot take both replicas.
      # ScheduleAnyway = a preference, not a rule: it can never block a rollout.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: chicanodev
              app.kubernetes.io/component: web
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          # No tag here on purpose. Each overlay pins an immutable digest via
          # `images:` in its kustomization.yaml, and CI is the only thing that changes it.
          image: ghcr.io/chicanodev/chicanodev-site
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            # Initial values, not guarantees. Validate with `kubectl top pod`.
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          lifecycle:
            preStop:
              # Keep serving for a few seconds after the pod leaves the Service
              # endpoints, so in-flight requests during a rollout are not cut off.
              exec:
                command: ["sleep", "5"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # nginx's pid file and temp dirs live here; the rest of the filesystem is read-only.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
