# The pod never talks to the Kubernetes API, so this account has no Role and
# its token is not mounted (see automountServiceAccountToken below and in the
# Deployment). A dedicated account keeps it from inheriting `default`'s grants.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chicanodev
  labels:
    app.kubernetes.io/name: chicanodev
automountServiceAccountToken: false
