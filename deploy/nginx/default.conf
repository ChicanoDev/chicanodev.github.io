# nginx config for the static ChicanoDev site.
#
# Gotcha worth knowing: add_header is NOT additive across levels. If a location
# defines any add_header, it drops every add_header inherited from the server
# block. So each location below re-includes the security headers explicitly.

server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Behind Cloudflare and Traefik the container does not know its public
    # scheme or host. Redirects must be relative ("Location: /posts/x/").
    absolute_redirect off;

    # Liveness/readiness target. Never cached, and kept out of the access log
    # so probes (every few seconds, from two pods) don't drown real traffic.
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 "ok\n";
    }

    # Astro fingerprints everything in /_astro (the hash changes when the
    # content does), so browsers and Cloudflare may keep it for a year.
    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Which release and publication cutoff is this pod serving?
    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # HTML, RSS, sitemaps, robots.txt: URLs don't change when content does, so
    # caches may store them but must revalidate (cheap 304) before reuse.
    location / {
        # "$uri/" names a directory, so nginx serves its index file and 301s
        # "/posts/x" -> "/posts/x/". Do NOT list "$uri/index.html" here: it
        # would serve the page at both URLs and skip the redirect.
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
